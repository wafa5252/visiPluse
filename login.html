<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VisiPulse — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          base:   '#0E1620',
          panel:  '#16212C',
          raised: '#1C2A38',
          hair:   '#26323E',
          ink:    '#E7EDF3',
          muted:  '#87A0B4',
          signal: '#45D6B5',
          warn:   '#E8A33D',
          crit:   '#E1585A',
          info:   '#5B9BD1',
        },
        fontFamily: {
          sans: ['"IBM Plex Sans"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        }
      }
    }
  }
</script>
<style>
  body { background:
    radial-gradient(circle at 15% 10%, rgba(69,214,181,0.06), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(91,155,209,0.06), transparent 40%),
    #0E1620;
  }
  .pulse-line { stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 2.4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
</style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans text-ink px-4">

  <div class="w-full max-w-sm">
    <div class="flex items-center gap-3 mb-8 justify-center">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <circle cx="17" cy="17" r="16" stroke="#26323E" stroke-width="1"/>
        <path class="pulse-line" d="M4 17H11L14 9L18 25L21 17H30" stroke="#45D6B5" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="text-lg font-semibold tracking-tight leading-none">VisiPulse</div>
        <div class="text-[11px] text-muted font-mono leading-none mt-1">Predictive Hospital Governance</div>
      </div>
    </div>

    <div class="bg-panel border border-hair rounded-sm p-7 relative">
      <div class="absolute -top-px -left-px w-3 h-3 border-t border-l border-signal/60"></div>
      <div class="absolute -top-px -right-px w-3 h-3 border-t border-r border-signal/60"></div>
      <div class="absolute -bottom-px -left-px w-3 h-3 border-b border-l border-signal/60"></div>
      <div class="absolute -bottom-px -right-px w-3 h-3 border-b border-r border-signal/60"></div>

      <h1 class="text-base font-medium mb-1">Facility sign-in</h1>
      <p class="text-sm text-muted mb-6">Enter your credentials to access the monitoring console.</p>

      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-mono text-muted mb-1.5" for="username">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username"
            class="w-full bg-raised border border-hair rounded-sm px-3 py-2 text-sm outline-none focus:border-signal transition-colors" />
        </div>
        <div>
          <label class="block text-xs font-mono text-muted mb-1.5" for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password"
            class="w-full bg-raised border border-hair rounded-sm px-3 py-2 text-sm outline-none focus:border-signal transition-colors" />
        </div>

        <div id="errorBox" class="hidden text-sm text-crit bg-crit/10 border border-crit/30 rounded-sm px-3 py-2"></div>

        <button type="submit" id="submitBtn"
          class="w-full bg-signal text-base font-medium text-sm rounded-sm py-2.5 hover:opacity-90 transition-opacity">
          Sign in
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-hair text-[11px] font-mono text-muted leading-relaxed">
        <div class="mb-1 text-muted/80">DEMO ACCOUNTS</div>
        <div>admin / AdminPass123</div>
        <div>dr.hana / ClinicPass123 <span class="text-muted/60">(medical staff)</span></div>
        <div>tech.omar / TechPass123 <span class="text-muted/60">(maintenance)</span></div>
      </div>
    </div>

    <p class="text-center text-[11px] text-muted/60 font-mono mt-6">NCA ECC-aligned access · All actions audited</p>
  </div>

<script src="config.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.classList.add('hidden');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    try {
      const body = new URLSearchParams();
      body.set('username', username);
      body.set('password', password);

      const res = await fetch(`${API_BASE}/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body,
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || 'Sign-in failed');
      }

      const data = await res.json();
      localStorage.setItem('visipulse_token', data.access_token);
      localStorage.setItem('visipulse_role', data.role);
      localStorage.setItem('visipulse_username', data.username);
      localStorage.setItem('visipulse_user_id', data.user_id);
      window.location.href = 'index.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove('hidden');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
